[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-architecture"
version = "0.1.0"
description = "Decoder-only Transformer, neutral runtime policies and native checkpoint readers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["torch==2.13.0"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_architecture*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
